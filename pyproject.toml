[project]
name = "cojopy"
version = "0.1.5"
description = "Conditional Analysis with LD Matrix."
authors = [{ name = "Jianhua Wang", email = "jianhua.mert@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "typer>=0.7.0",
    "numpy>=1.21.2",
    "pandas>=1.3.3",
    "scipy>=1.7.3",
]

[project.scripts]
cojo = "cojopy.cli:app"

[dependency-groups]
dev = [
    "black>=23.9.1",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=1.5.1",
    "pytest>=7.4.2",
    "pytest-cov>=4.1.0",
    "tox>=4.11.3",
    "virtualenv>=20.24.5",
    "pip>=23.2.1",
    "twine>=4.0.2",
    "pre-commit>=3.4.0",
    "toml>=0.10.2",
    "bump2version>=1.0.1",
    "jupyter>=1.0.0",
    "mkdocs>=1.5.3",
    "mkdocs-include-markdown-plugin>=6.0.1",
    "mkdocs-material>=9.4.2",
    "mkdocs-autorefs>=0.5.0",
    "mkdocstrings-python>=1.7.0",
    "mkdocs-material-extensions>=1.2",
    "build>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["cojopy", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["cojopy"]
